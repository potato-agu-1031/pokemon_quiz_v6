function startGame(){audioInit();if(bgmOn)startBgm();quiz=[];var guard=0;while(quiz.length<10&&guard<100){var q=makeQuestion();if(q&&q.opts&&q.opts.length===3&&unique(q.opts).length===3)quiz.push(q);guard++}idx=0;score=0;home.classList.add("hidden");result.classList.add("hidden");game.classList.remove("hidden");show()}
function show(){locked=false;var q=quiz[idx];count.textContent=(idx+1)+" / 10 もん";scoreEl.textContent="せいかい "+score;bar.style.width=(idx*10)+"%";question.textContent=q.q;choices.innerHTML="";feedback.className="feedback hidden";feedback.textContent="";next.classList.add("hidden");poke.classList.add("hidden");poke.innerHTML="";if(q.kind==="image"&&q.p&&A[q.p]){var im=document.createElement("img");im.src=A[q.p].image;im.alt="";poke.appendChild(im);poke.classList.remove("hidden")}shuffle(q.opts).forEach(function(opt){var b=document.createElement("button");b.type="button";b.className="choice";b.textContent=opt;b.addEventListener("click",function(){answer(b,opt,q)},false);choices.appendChild(b)})}
function answer(btn,opt,q){if(locked)return;locked=true;var all=choices.querySelectorAll(".choice");for(var i=0;i<all.length;i++)all[i].disabled=true;var ok=opt===q.ans;if(ok){score++;btn.classList.add("correct");tone(660,.12,.15);setTimeout(function(){tone(880,.12,.15)},80);setTimeout(function(){tone(1100,.15,.15)},160);fxPop()}else{btn.classList.add("wrong");tone(180,.2,.14);for(var j=0;j<all.length;j++)if(all[j].textContent===q.ans)all[j].classList.add("correct")}feedback.className="feedback "+(ok?"ok":"ng");feedback.textContent=ok?"⭕ せいかい！ すごい！":"❌ ざんねん！ こたえは 「"+q.ans+"」 だよ！";scoreEl.textContent="せいかい "+score;next.classList.remove("hidden")}
function nextQ(){if(idx<9){idx++;show()}else finish()}
function finish(){fxPop();tone(660,.12,.15);setTimeout(function(){tone(880,.12,.15)},100);setTimeout(function(){tone(1047,.2,.15)},200);game.classList.add("hidden");result.classList.remove("hidden");final.textContent=score+" / 10";comment.textContent=score===10?"ポケモン はかせ だ！ 🎉":score>=8?"すごい！ さいこう！ ⭐":score>=5?"いい ちょうし！ ✨":"もういっかい やってみよう！ 💪"}
}
start.addEventListener("click",startGame,false);again.addEventListener("click",startGame,false);next.addEventListener("click",nextQ,false);bgmBtn.addEventListener("click",function(){audioInit();bgmOn=!bgmOn;bgmBtn.textContent=bgmOn?"🎵 BGM ON":"🎵 BGM OFF";if(bgmOn)startBgm();else stopBgm()},false);seBtn.addEventListener("click",function(){seOn=!seOn;seBtn.textContent=seOn?"🔊 おと ON":"🔇 おと OFF";if(seOn){audioInit();tone(660,.1,.15)}},false);
})();
</script></body></html>
